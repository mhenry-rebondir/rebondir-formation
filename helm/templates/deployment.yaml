apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moodle.fullname" . }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moodle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moodle.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: MOODLE_URL
              value: {{ default (printf "http://%s" (index .Values.ingress.hosts 0).host) .Values.env.url | quote }}
            - name: MOODLE_DATABASE_TYPE
              value: "pgsql"
            - name: MOODLE_DATABASE_HOST
              value: "{{ .Values.env.database.host }}"
            - name: MOODLE_DATABASE_NAME
              value: "{{ .Values.env.database.name }}"
            - name: MOODLE_DATABASE_USER
              value: "{{ .Values.env.database.user }}"
            - name: MOODLE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: db-password
            - name: MOODLE_REDIS_HOST
              value: "{{ .Values.env.redis.host }}"
            - name: MOODLE_STORAGE_FACADE
              value: "s3"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: s3-access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: s3-secret-key
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "200m"
              memory: "512Mi"
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          #   initialDelaySeconds: 60
          #   periodSeconds: 15